name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly heartbeat so the off-PR jobs (Windows build, mobile e2e) catch
    # environment drift even during quiet weeks.
    - cron: "0 3 * * 1"

# Every job only checks out, builds, and tests (mobile-e2e additionally
# uploads an artifact, which needs no extra scope) — least privilege.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job only reads the repo; don't leave the token in git config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run Tests
        run: bun run test

      - name: Build
        run: bun run build:dev

      - name: E2E (serve static export)
        run: |
          # Serve the static export and run the bun e2e specs against it.
          # The specs skip when no server responds, so fail loudly if the
          # server never comes up — otherwise e2e would be a silent no-op.
          bunx serve@14 out -l 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -sf http://localhost:3000 >/dev/null 2>&1; then
            echo "Static server failed to start on :3000" >&2
            exit 1
          fi
          bun run test:e2e
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

  starter-site:
    # create-amytis gives new sites site.config.example.ts and no locale trees.
    # The code must type-check and build against that config too, not only
    # against this repo's two-language site.config.ts.
    name: Starter site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up the checkout as create-amytis sets up a new site
        run: >-
          bun -e "import { setUpNewSite } from './packages/create-amytis/src/index.ts';
          const result = setUpNewSite('.', { projectName: 'starter-check', title: 'Starter Check', description: 'A new Amytis site' });
          console.log(result);
          if (!result.starter) throw new Error('site.config.example.ts is missing');
          if (!result.starterContent) throw new Error('the starter content is missing');"

      # The new site's own validate: lint, typecheck and build, without the
      # engine's tests, which setUpNewSite removed.
      - name: Validate
        run: bun run validate

      # The starter reports broken links as warnings; a new site should have none.
      - name: No broken links
        run: bun scripts/check-links.ts --site out --mode error

  upgrade-check:
    # Sites already made from the last release upgrade with `create-amytis
    # upgrade`. A change they can't take (a config field the starter merge
    # can't bring in, code their content no longer builds with) fails here,
    # before it is released, instead of in someone's site.
    name: Upgrade check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The history and tags, to find the last release.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      # git archive gives the same files as a release's download. The release
      # is the last one before this commit, so a release commit is checked
      # against the one before it. The site is made by the scaffolder that
      # release shipped, as the sites people have were, not by this commit's,
      # and installed before its first commit, as `bun create amytis` does: the
      # install renames the package in bun.lock, so the lockfile takes the
      # kept-lockfile path real sites take, and the site has its dependencies
      # even when the upgrade changes nothing and installs nothing.
      - name: Make a site from the last release
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)
          echo "Last release: $base"
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/target" "$RUNNER_TEMP/site"
          git archive "$base" | tar -x -C "$RUNNER_TEMP/base"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/target"
          cp -R "$RUNNER_TEMP/base/." "$RUNNER_TEMP/site"
          SITE="$RUNNER_TEMP/site" bun -e "import { setUpNewSite } from '$RUNNER_TEMP/base/packages/create-amytis/src/index.ts';
            setUpNewSite(process.env.SITE, { projectName: 'upgrade-check', title: 'Upgrade Check', description: 'A site from the last release' });"
          cd "$RUNNER_TEMP/site"
          bun install
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Site made from $base"

      # Exits 1 if the upgrade leaves anything to resolve by hand, which a
      # site that changed nothing never should.
      - name: Upgrade it to this commit
        working-directory: ${{ runner.temp }}/site
        run: bun "$GITHUB_WORKSPACE/packages/create-amytis/src/index.ts" upgrade --base-dir "$RUNNER_TEMP/base" --target-dir "$RUNNER_TEMP/target"

      # Every upgraded site has `bun run upgrade`, including ones made before
      # create-amytis added it, and this site never changed it.
      - name: The site can upgrade again
        working-directory: ${{ runner.temp }}/site
        run: |
          node -e "const s = require('./package.json').scripts; if (s.upgrade !== 'bunx create-amytis@latest upgrade') throw new Error('unexpected upgrade script: ' + JSON.stringify(s.upgrade));"

      - name: Validate
        working-directory: ${{ runner.temp }}/site
        run: bun run validate

      - name: No broken links
        working-directory: ${{ runner.temp }}/site
        run: bun scripts/check-links.ts --site out --mode error

  windows-build:
    name: Windows build
    runs-on: windows-latest
    # Windows is a supported target that has shipped a string of blind fixes
    # (bun-installer node_modules layout, stale dev-types validator, path
    # handling) with zero CI coverage. Build-only coverage via the documented
    # npm-install path (docs/TROUBLESHOOTING.md "Windows: use npm install")
    # catches the next regression. Kept off the PR loop for speed; runs on
    # main pushes, manual dispatch, and the weekly schedule.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun (runtime for build scripts)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      - name: Install dependencies with npm
        # bun's installer is unreliable on Windows (symlinked isolated store
        # breaks shiki/postcss resolution; hoisted linker corrupts bin shims).
        # npm's flat layout is the documented Windows path; bun.lock stays the
        # source of truth and package-lock.json is git-ignored.
        run: npm install

      - name: Build (production)
        run: bun run build

  mobile-e2e:
    name: Mobile e2e (Playwright)
    runs-on: ubuntu-latest
    # The 16-device mobile-compat matrix previously only ran manually, so
    # mobile regressions shipped unnoticed. Kept off the PR loop (browser
    # downloads + 16 projects are slow); runs on main pushes, manual
    # dispatch, and the weekly schedule.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export (full production build)
        # Must be the FULL build: build:dev skips next-image-export-optimizer,
        # so the optimized image paths in the exported HTML would 404 and every
        # image-dependent mobile assertion fails (naturalWidth 0, collapsed
        # click targets). Off the PR loop, the extra ~2 min doesn't matter.
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run mobile compatibility tests
        # CI=true makes playwright.config.ts serve the built out/ directory
        # instead of starting the dev server.
        run: bun run test:mobile

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  production-build:
    name: Production build (full)
    runs-on: ubuntu-latest
    # The full production build (image optimization + prod Pagefind path) is
    # ~1-2 min heavier than build:dev and exercises the export-only paths PRs
    # don't. Gated to manual runs so it never slows the PR loop — trigger it
    # from the Actions tab before a release.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job only reads the repo; don't leave the token in git config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (production)
        run: bun run build
